name: Weather Today quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          for file in assets/js/*.js scripts/build.js; do node --check "$file"; done
      - name: Build static pages and SEO files
        run: node scripts/build.js
      - name: Run project verification suite
        run: python scripts/test_suite.py
      - name: Commit regenerated static pages on pull requests
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Weather Today static pages and SEO"
            git push origin "HEAD:$BRANCH_NAME"
          fi
